<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TikSave — Download TikTok Tanpa Watermark</title>
<meta name="description" content="Download video TikTok tanpa watermark, MP3, dan slide foto. Gratis, cepat, tanpa login.">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0a0e1a;
    --card: #131826;
    --border: #1f2937;
    --text: #e5e7eb;
    --muted: #9ca3af;
    --accent: #22d3ee;
    --accent2: #10b981;
    --danger: #ef4444;
    --warn: #fbbf24;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: radial-gradient(circle at top, #0f172a 0%, #0a0e1a 60%);
    color: var(--text);
    min-height: 100vh;
    padding: 20px;
    line-height: 1.5;
  }
  .container { max-width: 640px; margin: 0 auto; }

  header { text-align: center; margin-bottom: 32px; padding-top: 20px; }
  .logo {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-size: 26px;
    font-weight: 800;
    margin-bottom: 8px;
  }
  .logo-icon {
    width: 40px; height: 40px;
    background: linear-gradient(135deg, #22d3ee, #10b981);
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
  }
  .logo-text {
    background: linear-gradient(90deg, #22d3ee, #10b981);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  header p { color: var(--muted); font-size: 14px; }

  .input-box {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 20px;
  }
  .input-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  #urlInput {
    flex: 1;
    min-width: 200px;
    padding: 14px 16px;
    background: #0a0e1a;
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-size: 15px;
    outline: none;
    transition: border 0.2s;
  }
  #urlInput:focus { border-color: var(--accent); }
  #urlInput::placeholder { color: #4b5563; }

  .btn {
    padding: 14px 24px;
    background: linear-gradient(135deg, #06b6d4, #10b981);
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s;
    white-space: nowrap;
  }
  .btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(16,185,129,0.25); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .btn-secondary {
    background: #1f2937;
    color: var(--text);
  }
  .btn-secondary:hover:not(:disabled) { box-shadow: 0 8px 20px rgba(31,41,55,0.5); }

  .btn-download {
    display: block;
    width: 100%;
    padding: 12px;
    background: linear-gradient(135deg, #06b6d4, #10b981);
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    text-align: center;
    text-decoration: none;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .btn-download:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(16,185,129,0.3); }

  .status {
    text-align: center;
    padding: 12px;
    font-size: 14px;
    border-radius: 10px;
    margin-top: 12px;
    display: none;
  }
  .status.info    { background: rgba(34,211,238,0.1); color: #67e8f9; display: block; }
  .status.error   { background: rgba(239,68,68,0.1);  color: #fca5a5; display: block; }
  .status.success { background: rgba(16,185,129,0.1); color: #6ee7b7; display: block; }

  .spinner {
    display: inline-block;
    width: 14px; height: 14px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: white;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    vertical-align: middle;
    margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .result {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    margin-bottom: 20px;
    animation: fadeIn 0.4s ease-out;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  .result-header {
    display: flex;
    gap: 14px;
    padding: 16px;
    border-bottom: 1px solid var(--border);
    align-items: center;
  }
  .author-avatar {
    width: 48px; height: 48px;
    border-radius: 50%;
    background: #1f2937;
    overflow: hidden;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
  }
  .author-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .author-info { flex: 1; min-width: 0; }
  .author-name { font-weight: 600; font-size: 15px; color: #22d3ee; }
  .author-desc {
    color: var(--muted);
    font-size: 13px;
    margin-top: 2px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .video-preview {
    background: #000;
    display: flex;
    justify-content: center;
    padding: 10px;
  }
  .video-preview video, .video-preview img {
    max-width: 100%;
    max-height: 500px;
    border-radius: 8px;
  }

  .stats {
    display: flex;
    justify-content: space-around;
    padding: 14px;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
    gap: 10px;
  }
  .stat { text-align: center; }
  .stat-value { font-weight: 700; font-size: 15px; color: var(--text); }
  .stat-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }

  .download-section {
    padding: 16px;
    display: grid;
    gap: 10px;
  }
  .download-group-title {
    font-size: 12px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 4px;
  }
  .download-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .actions-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    padding: 0 16px 16px;
  }

  .skeleton {
    background: linear-gradient(90deg, #1f2937 25%, #2d3748 50%, #1f2937 75%);
    background-size: 200% 100%;
    animation: skeleton 1.5s infinite;
    border-radius: 8px;
  }
  @keyframes skeleton { to { background-position: -200% 0; } }

  .footer {
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    padding: 24px 0;
  }
  .footer a { color: var(--accent); text-decoration: none; }
  .footer a:hover { text-decoration: underline; }

  .disclaimer {
    background: rgba(251,191,36,0.08);
    border: 1px solid rgba(251,191,36,0.2);
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 12px;
    color: #fcd34d;
    margin-bottom: 20px;
    line-height: 1.6;
  }

  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: #1f2937;
    color: white;
    padding: 12px 24px;
    border-radius: 30px;
    font-size: 14px;
    font-weight: 500;
    transition: transform 0.3s;
    z-index: 1000;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="container">

  <header>
    <div class="logo">
      <div class="logo-icon">⬇</div>
      <div class="logo-text">TikSave</div>
    </div>
    <p>Download video TikTok tanpa watermark — gratis, cepat, tanpa login</p>
  </header>

  <div class="disclaimer">
    ⚠️ Gunakan hanya untuk keperluan pribadi. Hormati hak cipta kreator — jangan reupload tanpa izin.
  </div>

  <div class="input-box">
    <div class="input-row">
      <input
        type="text"
        id="urlInput"
        placeholder="Tempel link TikTok di sini..."
        autocomplete="off"
        spellcheck="false"
      >
      <button class="btn" id="fetchBtn" onclick="handleFetch()">Ambil</button>
    </div>
    <div id="status" class="status"></div>
  </div>

  <div id="resultContainer"></div>

  <div class="footer">
    © 2026 TikSave · Dibuat dengan ❤️ · <a href="#" onclick="showDisclaimer(); return false;">Disclaimer</a>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   TikSave — TikTok Downloader (No Watermark)
   API: TikWM (https://www.tikwm.com/api/)
   Fallback: none (bisa ditambah nanti)
   ============================================================ */

const API_ENDPOINT = 'https://www.tikwm.com/api/';
const CORS_PROXIES = [
  'https://corsproxy.io/?url=',
  'https://api.allorigins.win/raw?url='
];

/* ---------- HELPERS ---------- */
function $(id) { return document.getElementById(id); }

function setStatus(msg, type = 'info') {
  const el = $('status');
  if (!msg) {
    el.className = 'status';
    el.textContent = '';
    return;
  }
  el.className = 'status ' + type;
  el.innerHTML = msg;
}

function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

function formatNumber(n) {
  n = Number(n) || 0;
  if (n >= 1e9) return (n / 1e9).toFixed(1) + 'B';
  if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
  if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
  return String(n);
}

function escapeHtml(s) {
  if (s == null) return '';
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

function isValidTikTokUrl(url) {
  if (!url) return false;
  return /(?:tiktok\.com|vt\.tiktok\.com|vm\.tiktok\.com)/i.test(url);
}

/* ---------- API CALL (with fallback) ---------- */
async function fetchFromAPI(tiktokUrl) {
  const apiUrl = API_ENDPOINT + '?url=' + encodeURIComponent(tiktokUrl) + '&hd=1';

  // Coba langsung dulu
  try {
    const res = await fetch(apiUrl, { headers: { 'Accept': 'application/json' } });
    if (res.ok) {
      const data = await res.json();
      if (data && data.code === 0 && data.data) return data;
    }
  } catch (e) {
    // CORS atau network error — lanjut ke proxy
  }

  // Fallback ke CORS proxy
  for (const proxy of CORS_PROXIES) {
    try {
      const res = await fetch(proxy + encodeURIComponent(apiUrl));
      if (!res.ok) continue;
      const data = await res.json();
      if (data && data.code === 0 && data.data) return data;
    } catch (e) {
      // lanjut proxy berikutnya
    }
  }

  throw new Error('Gagal mengambil data. Coba lagi atau cek link TikTok-nya.');
}

/* ---------- MAIN HANDLER ---------- */
async function handleFetch() {
  const btn = $('fetchBtn');
  const input = $('urlInput');
  const url = input.value.trim();

  if (!url) {
    setStatus('Masukkan link TikTok dulu.', 'error');
    return;
  }
  if (!isValidTikTokUrl(url)) {
    setStatus('Link tidak valid. Pastikan link dari tiktok.com atau vt.tiktok.com.', 'error');
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Mengambil...';
  setStatus('Menghubungi server...', 'info');
  $('resultContainer').innerHTML = '';

  try {
    const data = await fetchFromAPI(url);
    setStatus('Berhasil! Data siap.', 'success');
    renderResult(data.data);
    $('resultContainer').scrollIntoView({ behavior: 'smooth', block: 'start' });
  } catch (err) {
    setStatus(err.message || 'Terjadi kesalahan.', 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Ambil';
  }
}

/* ---------- RENDER ---------- */
function renderResult(d) {
  if (!d) {
    setStatus('Data kosong dari server.', 'error');
    return;
  }

  const container = $('resultContainer');
  const isSlideshow = Array.isArray(d.images) && d.images.length > 0;

  const authorAvatar = d.author?.avatar
    ? `<img src="${escapeHtml(d.author.avatar)}" alt="avatar" onerror="this.parentElement.innerHTML='👤'">`
    : '👤';

  const authorName = d.author?.unique_id ? '@' + escapeHtml(d.author.unique_id) : 'TikTok User';
  const description = d.title || '(tanpa deskripsi)';

  // Preview
  let previewHtml = '';
  if (isSlideshow) {
    previewHtml = `
      <div class="video-preview">
        <img src="${escapeHtml(d.images[0])}" alt="preview" loading="lazy">
      </div>
    `;
  } else {
    const previewUrl = d.play || d.wmplay || '';
    previewHtml = `
      <div class="video-preview">
        <video controls playsinline preload="metadata" poster="${escapeHtml(d.origin_cover || '')}">
          <source src="${escapeHtml(previewUrl)}" type="video/mp4">
        </video>
      </div>
    `;
  }

  // Stats
  const statsHtml = `
    <div class="stats">
      <div class="stat">
        <div class="stat-value">${formatNumber(d.play_count)}</div>
        <div class="stat-label">Views</div>
      </div>
      <div class="stat">
        <div class="stat-value">${formatNumber(d.digg_count)}</div>
        <div class="stat-label">Likes</div>
      </div>
      <div class="stat">
        <div class="stat-value">${formatNumber(d.comment_count)}</div>
        <div class="stat-label">Comments</div>
      </div>
      <div class="stat">
        <div class="stat-value">${formatNumber(d.share_count)}</div>
        <div class="stat-label">Shares</div>
      </div>
    </div>
  `;

  // Download buttons
  let downloadHtml = '';
  if (isSlideshow) {
    downloadHtml = `
      <div class="download-group-title">Slide Foto (${d.images.length})</div>
      <div class="download-row">
        ${d.images.map((img, i) => `
          <a class="btn-download" href="${escapeHtml(img)}" target="_blank" rel="noopener" download="tiktok_slide_${i+1}.jpg">
            🖼️ Foto ${i + 1}
          </a>
        `).join('')}
      </div>
    `;
  } else {
    const playUrl = d.play || d.wmplay;
    const hdUrl = d.hdplay || d.play;
    const musicUrl = d.music;
    downloadHtml = `
      <div class="download-group-title">Video</div>
      <div class="download-row">
        <a class="btn-download" href="${escapeHtml(hdUrl)}" target="_blank" rel="noopener" download="tiktok_hd.mp4">
          🎬 HD (No WM)
        </a>
        <a class="btn-download" href="${escapeHtml(playUrl)}" target="_blank" rel="noopener" download="tiktok_sd.mp4">
          📱 SD
        </a>
      </div>
      ${musicUrl ? `
        <div class="download-group-title">Audio</div>
        <div class="download-row" style="grid-template-columns: 1fr;">
          <a class="btn-download" href="${escapeHtml(musicUrl)}" target="_blank" rel="noopener" download="tiktok_audio.mp3">
            🎵 MP3
          </a>
        </div>
      ` : ''}
    `;
  }

  // Action buttons
  const actionsHtml = `
    <div class="actions-row">
      <button class="btn btn-secondary" onclick="copyCaption()">📋 Copy Caption</button>
      <button class="btn btn-secondary" onclick="resetAll()">🔄 Reset</button>
    </div>
  `;

  container.innerHTML = `
    <div class="result">
      <div class="result-header">
        <div class="author-avatar">${authorAvatar}</div>
        <div class="author-info">
          <div class="author-name">${authorName}</div>
          <div class="author-desc">${escapeHtml(description)}</div>
        </div>
      </div>
      ${previewHtml}
      ${statsHtml}
      <div class="download-section">${downloadHtml}</div>
      ${actionsHtml}
    </div>
  `;

  // Simpan caption buat tombol copy
  window.__currentCaption = description;
}

/* ---------- ACTIONS ---------- */
function copyCaption() {
  const cap = window.__currentCaption || '';
  if (!cap) { toast('Tidak ada caption.'); return; }
  navigator.clipboard.writeText(cap)
    .then(() => toast('Caption tersalin!'))
    .catch(() => toast('Gagal menyalin.'));
}

function resetAll() {
  $('urlInput').value = '';
  $('resultContainer').innerHTML = '';
  setStatus('');
  $('urlInput').focus();
}

function showDisclaimer() {
  alert(
    'TikSave — Disclaimer\n\n' +
    '• Web ini hanya alat bantu unduh untuk penggunaan pribadi.\n' +
    '• Hormati hak cipta kreator. Jangan reupload tanpa izin.\n' +
    '• Kami tidak menyimpan link atau file Anda.\n' +
    '• Semua proses melalui API publik pihak ketiga.\n\n' +
    'Dengan menggunakan web ini, Anda setuju dengan ketentuan tersebut.'
  );
}

/* ---------- PASTE AUTO-DETECT ---------- */
$('urlInput').addEventListener('paste', () => {
  setTimeout(() => {
    const v = $('urlInput').value.trim();
    if (isValidTikTokUrl(v)) {
      handleFetch();
    }
  }, 100);
});

$('urlInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') handleFetch();
});
</script>

</body>
</html>
